name: Validate USB installer host interfaces
on:
  push:
    paths:
      - usb-install.sh
      - tools/usb-gpt.sh
      - tools/usb-target-linux.sh
      - .github/workflows/validate-usb-installer.yml
      - images/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and verify public distribution
        run: |
          set -eu
          sh -n usb-install.sh tools/usb-gpt.sh tools/usb-target-linux.sh
          ./usb-install.sh --help
          (cd images && sha256sum -c SHA256SUMS)
          gzip -t images/m-boot-combined.raw.gz
          unzip -tqq images/m-boot-loader.zip
      - name: Install installer dependencies for real preflight
        run: |
          set -eu
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gdisk e2fsprogs parted util-linux
      - name: Verify public disk image has complete ESP loader and empty ext4 payload
        run: |
          set -eu
          grep -Fx 'loader_location=esp' images/BUILD-INFO.txt
          grep -Fx 'data_filesystem=ext4' images/BUILD-INFO.txt
          grep -Fx 'partition_count=2' images/BUILD-INFO.txt
          gzip -dc images/m-boot-combined.raw.gz > "$RUNNER_TEMP/public.raw"
          sha256sum "$RUNNER_TEMP/public.raw" | awk '{ print $1 }' > "$RUNNER_TEMP/public.hash"
          awk '{ print $1 }' images/RAW-SHA256SUMS > "$RUNNER_TEMP/expected.hash"
          cmp "$RUNNER_TEMP/public.hash" "$RUNNER_TEMP/expected.hash"
          loop=
          esp=$(mktemp -d)
          cleanup() {
            if mountpoint -q "$esp"; then sudo umount "$esp"; fi
            if [ -n "$loop" ]; then sudo losetup -d "$loop"; fi
            rmdir "$esp" 2>/dev/null || :
          }
          trap cleanup EXIT
          loop=$(sudo losetup --find --show --partscan "$RUNNER_TEMP/public.raw")
          sudo mount -t vfat -o ro "$loop"p2 "$esp"
          sudo sgdisk --print "$RUNNER_TEMP/public.raw" > "$RUNNER_TEMP/public-partitions.txt"
          if awk '$1 ~ /^[0-9]+$/ && $1 >= 3 {found=1} END {exit !found}' "$RUNNER_TEMP/public-partitions.txt"
          then
            echo 'unexpected extra partition in boot-only distribution' >&2
            exit 1
          fi
          sudo test -s "$esp/m/boot/loader/init"
          sudo test -s "$esp/EFI/BOOT/BOOTX64.EFI"
          sudo test -s "$esp/EFI/BOOT/BOOTAA64.EFI"
          for target in i386-pc x86_64-efi arm64-efi
          do
            sudo test -s "$esp/m/boot/loader/$target/normal.mod"
          done
          echo 'PASS: public image contains complete ESP loader and no data partition'
      - name: Exercise production GPT and ext4 operations on disposable 4 GiB image
        run: |
          set -eu
          raw="$RUNNER_TEMP/public.raw"
          disk="$RUNNER_TEMP/installer-4g.raw"
          cp --sparse=always "$raw" "$disk"
          truncate -s 4G "$disk"
          usb_work=$(mktemp -d "$RUNNER_TEMP/installer-test.XXXXXXXX")
          loop=
          usb_mounted=
          cleanup() {
            if [ -n "$usb_mounted" ]; then sudo umount "$usb_mounted" || :; fi
            if [ -n "$loop" ]; then sudo losetup -d "$loop" || :; fi
            rm -rf -- "$usb_work"
          }
          trap cleanup EXIT
          loop=$(sudo losetup --find --show --partscan "$disk")
          test "$(sudo losetup -n -O BACK-FILE "$loop")" = "$disk"
          usb_disk="$loop"
          usb_bytes=$(sudo blockdev --getsize64 "$usb_disk")
          usb_fail() { printf 'simulation: %s\n' "$1" >&2; exit 1; }
          usb_info() { printf 'simulation: %s\n' "$1"; }
          . ./tools/usb-gpt.sh
          . ./tools/usb-target-linux.sh
          usb_require
          usb_expand_gpt
          usb_refresh
          usb_format_mount
          test -d "$usb_work/mount/m/boot/iso"
          test -w "$usb_work/mount/m/boot/iso"
          usb_unmount
          usb_check_fs
          if (usb_require_no_data_partition)
          then
            echo 'ERROR: data-partition guard accepted a provisioned disk' >&2
            exit 1
          fi
          sudo sgdisk --verify "$usb_disk"
          echo 'PASS: production Linux GPT and ext4 routines on a disposable disk image'
      - name: Exercise real interactive preflight with 16 MiB file quota
        run: |
          set -eu
          # A 2 GiB raw staging file must fail this quota, but normal
          # streamed image checksum and small ZIP staging must succeed.
          transcript="$RUNNER_TEMP/usb-installer-preflight.log"
          set +e
          printf 'q\n' | (
            ulimit -f 32768
            script -q -e -c './usb-install.sh' "$transcript"
          )
          outcome=$?
          set -e
          grep -F 'verifying published image and ESP loader backup checksums' "$transcript"
          if grep -F 'Available physical disks' "$transcript"
          then
            # The caller typed q: the script should exit without consent/writes.
            test "$outcome" -eq 0
          else
            # A runner with no physical disk can fail after a good preflight.
            grep -F 'no physical disks detected' "$transcript"
            test "$outcome" -eq 1
          fi
          if grep -E 'cannot decompress|Disk quota exceeded|decompressed image SHA256 mismatch' "$transcript"
          then
            echo 'Unexpected streaming preflight failure' >&2
            exit 1
          fi
