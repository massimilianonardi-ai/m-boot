name: Validate USB installer host interfaces
on:
  push:
    paths:
      - usb-install.sh
      - tools/usb-gpt.sh
      - tools/usb-target-linux.sh
      - tools/usb-target-macos.sh
      - .github/workflows/validate-usb-installer.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and verify public distribution
        run: |
          set -eu
          sh -n usb-install.sh tools/usb-gpt.sh tools/usb-target-linux.sh tools/usb-target-macos.sh
          ./usb-install.sh --help
          (cd images && sha256sum -c SHA256SUMS)
          gzip -t images/m-boot-combined.raw.gz
          unzip -tqq images/m-boot-loader.zip
      - name: Install installer dependencies for real preflight
        run: |
          set -eu
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gdisk exfatprogs parted util-linux
      - name: Exercise real interactive preflight with 16 MiB file quota
        run: |
          set -eu
          # A 2 GiB raw staging file must fail this quota, but normal
          # streamed image checksum and small ZIP staging must succeed.
          transcript="$RUNNER_TEMP/usb-installer-preflight.log"
          set +e
          printf 'q\n' | (
            ulimit -f 32768
            script -q -e -c './usb-install.sh' "$transcript"
          )
          outcome=$?
          set -e
          grep -F 'verifying published image and loader checksums' "$transcript"
          if grep -F 'Available physical disks' "$transcript"
          then
            # The caller typed q: the script should exit without consent/writes.
            test "$outcome" -eq 0
          else
            # A runner with no physical disk can fail after a good preflight.
            grep -F 'no physical disks detected' "$transcript"
            test "$outcome" -eq 1
          fi
          if grep -E 'cannot decompress|Disk quota exceeded|decompressed image SHA256 mismatch' "$transcript"
          then
            echo 'Unexpected streaming preflight failure' >&2
            exit 1
          fi
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and verify public distribution with native macOS tools
        run: |
          set -eu
          sh -n usb-install.sh tools/usb-gpt.sh tools/usb-target-linux.sh tools/usb-target-macos.sh
          ./usb-install.sh --help
          (cd images && shasum -a 256 -c SHA256SUMS)
          gzip -t images/m-boot-combined.raw.gz
          unzip -tqq images/m-boot-loader.zip
      - name: Verify native diskutil and plist schema read-only
        run: |
          set -eu
          diskutil list physical
          disk=$(diskutil list internal physical | awk '/^\/dev\/disk[0-9]+ / { print $1; exit }')
          test -n "$disk"
          diskutil info -plist "$disk" > "$RUNNER_TEMP/disk-info.plist"
          for key in WholeDisk Internal VirtualOrPhysical TotalSize DeviceBlockSize DeviceIdentifier
          do
            plutil -extract "$key" raw -o - "$RUNNER_TEMP/disk-info.plist"
          done
          # Exercise the actual platform adapter's read-only selection logic.
          usb_work="$RUNNER_TEMP"
          usb_fail() { printf '%s\n' "$1" >&2; exit 1; }
          . ./tools/usb-target-macos.sh
          usb_eligible "$disk"
          usb_list | grep -Fx "$disk"
          test "$(usb_sector "$disk")" = 512
          test "$(usb_identity "$disk")" = "$(basename "$disk")"
          echo "Validated the macOS native metadata and physical disk enumeration without disk writes"
