name: Validate boot media menu scripts
on:
  push:
    paths:
      - loader/init
      - loader/menu/boot-media*
      - build.sh
      - .github/workflows/validate-boot-media.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grub-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate current GRUB syntax and menu source references
        run: |
          set -eu
          ./tools/grub-script-check --version
          for script in loader/init loader/menu/boot-media loader/menu/boot-media-*
          do
            ./tools/grub-script-check "$script"
          done
          for script in             loader/menu/iso-boot/clonezilla.d/generic.cfg             loader/menu/iso-boot/gparted.d/generic.cfg             loader/menu/iso-boot/grml.d/generic.cfg             loader/menu/iso-boot/ubuntu.d/desktop-generic.cfg
          do
            test -s "$script"
            ./tools/grub-script-check "$script"
          done
          test -f manual/boot-media
          echo 'PASS: GRUB syntax and referenced legacy recipes; boot UI is unverified'
