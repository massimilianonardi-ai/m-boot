name: Validate boot media menu scripts
on:
  push:
    paths:
      - loader/init
      - loader/menu/boot-media*
      - loader/menu/iso-boot/**
      - manual/boot-media
      - manual/usb-update-menu
      - usb-update-menu.sh
      - build.sh
      - .github/workflows/validate-boot-media.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grub-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate current GRUB syntax and menu source references
        run: |
          set -eu
          ./tools/grub-script-check --version
          for script in loader/init loader/menu/boot-media loader/menu/boot-media-*; do
            test -s "$script"
            ./tools/grub-script-check "$script"
          done
          for script in \
            loader/menu/iso-boot/clonezilla.d/generic.cfg \
            loader/menu/iso-boot/gparted.d/generic.cfg \
            loader/menu/iso-boot/grml.d/generic.cfg \
            loader/menu/iso-boot/ubuntu.d/desktop-generic.cfg; do
            test -s "$script"
            ./tools/grub-script-check "$script"
          done
          grep -F 'source "$prefix/menu/boot-media-iso"' loader/menu/boot-media
          grep -F 'source "$prefix/menu/iso-boot/clonezilla.d/generic.cfg"' loader/menu/boot-media-recovery
          grep -F 'boot_media_iso_experimental' loader/menu/boot-media-recovery
          grep -F 'boot_media_iso_experimental' loader/menu/boot-media-install
          grep -F 'boot_media_iso_experimental' loader/menu/boot-media-network
          grep -F 'mt86p_900_x86_64' loader/menu/boot-media-diagnostics
          grep -F 'mt86p_900_arm64' loader/menu/boot-media-diagnostics
          grep -F 'linux "$2"' loader/menu/boot-media-diagnostics
          grep -F 'boot_media_grml "$selected_iso"' loader/menu/boot-media-recovery
          test -s manual/boot-media
          test -s manual/usb-update-menu
          sh -n usb-update-menu.sh
          sh usb-update-menu.sh --help
          if sh usb-update-menu.sh --esp / --apply; then
            echo 'ERROR: menu updater allowed unsafe root mountpoint' >&2
            exit 1
          fi
          echo 'PASS: current GRUB scripts parse; boot correctness still needs ISO and firmware tests'
