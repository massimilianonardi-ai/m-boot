name: Build complete bootable GPT image
on:
  push:
    paths:
      - .github/workflows/build-usb-image.yml
      - build.sh
      - install.sh
      - boot/**
      - loader/**
      - tests/qemu-combined-image.sh
      - tests/qemu-image.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install disk-image utilities
        run: |
          set -eu
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gdisk qemu-utils dosfstools e2fsprogs zstd zip unzip
          ./tools/grub-mkimage --version
          ./tools/grub-bios-setup --version
          mk_version=$(./tools/grub-mkimage --version | awk '/\(GRUB\)/ { print $NF }')
          bios_version=$(./tools/grub-bios-setup --version | awk '/\(GRUB\)/ { print $NF }')
          echo "mkimage=$mk_version bios-setup=$bios_version"
          test "$mk_version" = 2.12-1ubuntu7.3
          test "$bios_version" = 2.12-1ubuntu7.3
      - name: Generate same GPT for BIOS, x86_64 UEFI and ARM64 UEFI
        run: |
          set -eu
          sudo ./tests/qemu-combined-test.sh \
            --output "$RUNNER_TEMP/m-boot-usb-build" --prepare-only
          raw="$RUNNER_TEMP/m-boot-usb-build/m-boot-combined.raw"
          test -s "$raw"
          test "$(stat -c %s "$raw")" = 2147483648
          sudo sgdisk --verify "$raw"
          sudo sgdisk --print "$raw"
          sudo sgdisk --info=1 "$raw" | grep -F 'BIOS boot partition'
          sudo sgdisk --info=2 "$raw" | grep -F 'EFI system partition'
          sudo sgdisk --info=3 "$raw" | grep -F 'Linux filesystem'
      - name: Compress the complete disk and the separately restorable loader
        run: |
          set -eu
          root="$RUNNER_TEMP/m-boot-usb-build"
          raw="$root/m-boot-combined.raw"
          stage="$root/stages/i386-pc"
          pub="$RUNNER_TEMP/m-boot-publish"
          mkdir -p "$pub"
          sudo test -s "$stage/esp/m/boot/loader/init"
          printf '%s  m-boot-combined.raw\n' "$(sudo sha256sum "$raw" | awk '{print $1}')" \
            > "$pub/m-boot-combined.raw.sha256"
          sudo zstd -3 -T0 -c "$raw" > "$pub/m-boot-combined.raw.zst"
          sudo tar -C "$stage/esp" -cf - m/boot/loader | \
            zstd -3 -T0 -c > "$pub/m-boot-loader.tar.zst"
          zstd -t "$pub/m-boot-combined.raw.zst"
          zstd -t "$pub/m-boot-loader.tar.zst"
          zstd -dc "$pub/m-boot-loader.tar.zst" | tar -tf - | grep -Fx 'm/boot/loader/init'
          (cd "$pub" && sha256sum m-boot-combined.raw.zst m-boot-loader.tar.zst > SHA256SUMS)
          (cd "$pub" && sha256sum -c SHA256SUMS)
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'host=%s\n' "$(uname -m)"
            printf 'grub=%s\n' "$(./tools/grub-mkimage --version | awk '/\(GRUB\)/ { print $NF }')"
            printf 'image_bytes=%s\n' "$(stat -c %s "$raw")"
            printf 'target_sector_bytes=512\n'
            printf 'targets=i386-pc,x86_64-efi,arm64-efi\n'
            printf 'loader_location=esp\n'
            printf 'data_role=payload-only\n'
            printf 'data_filesystem=ext4\n'
            printf 'flash_is_destructive=yes\n'
            printf 'exfat_inplace_grow_supported=no\n'
          } > "$pub/BUILD-INFO.txt"
      - name: Stage verified cross-platform Git-tracked distribution
        run: |
          set -eu
          sh -n usb-install.sh tools/usb-target-linux.sh tools/usb-target-macos.sh tools/usb-gpt.sh
          sh usb-install.sh --help
          pub="$RUNNER_TEMP/m-boot-publish"
          raw="$RUNNER_TEMP/m-boot-usb-build/m-boot-combined.raw"
          stage="$RUNNER_TEMP/m-boot-usb-build/stages/i386-pc"
          mkdir -p "$pub/repo"
          sudo gzip -1 -c "$raw" > "$pub/repo/m-boot-combined.raw.gz"
          sudo sh -c 'cd "$1" && zip -qry "$2" m/boot/loader' sh \
            "$stage/esp" "$pub/repo/m-boot-loader.zip"
          unzip -tqq "$pub/repo/m-boot-loader.zip"
          unzip -Z -1 "$pub/repo/m-boot-loader.zip" | grep -Fx 'm/boot/loader/init'
          cp "$pub/m-boot-combined.raw.sha256" "$pub/repo/RAW-SHA256SUMS"
          cp "$pub/BUILD-INFO.txt" "$pub/repo/BUILD-INFO.txt"
          (cd "$pub/repo" && sha256sum m-boot-combined.raw.gz m-boot-loader.zip > SHA256SUMS)
          (cd "$pub/repo" && sha256sum -c SHA256SUMS)
          raw_hash=$(gzip -dc "$pub/repo/m-boot-combined.raw.gz" | sha256sum | awk '{print $1}')
          expected_hash=$(awk '{print $1}' "$pub/m-boot-combined.raw.sha256")
          test "$raw_hash" = "$expected_hash"
      - name: Simulate larger USB, preserve ESP loader, recreate empty ext4 payload
        run: |
          set -eu
          raw="$RUNNER_TEMP/m-boot-usb-build/m-boot-combined.raw"
          expanded="$RUNNER_TEMP/m-boot-expanded-4g.raw"
          pub="$RUNNER_TEMP/m-boot-publish"
          sudo cp --sparse=always "$raw" "$expanded"
          sudo truncate -s 4G "$expanded"
          start=$(sudo sgdisk --info=3 "$expanded" | awk '/First sector:/ {print $3}')
          test "$start" = 1071104
          sudo sgdisk -e "$expanded"
          sudo sgdisk --delete=3 --new=3:"$start":0 --typecode=3:8300 "$expanded"
          sudo sgdisk --verify "$expanded"
          sudo cmp -n 440 "$raw" "$expanded"
          sudo cmp -n 10485760 -i 1048576:1048576 "$raw" "$expanded"
          sudo cmp -n 536870912 -i 11534336:11534336 "$raw" "$expanded"
          loop=
          mnt=$(mktemp -d "$RUNNER_TEMP/m-boot-data-mount.XXXXXXXX")
          esp=$(mktemp -d "$RUNNER_TEMP/m-boot-esp-mount.XXXXXXXX")
          cleanup() {
            if mountpoint -q "$mnt"; then sudo umount "$mnt"; fi
            if mountpoint -q "$esp"; then sudo umount "$esp"; fi
            if [ -n "$loop" ]; then sudo losetup -d "$loop"; fi
            rmdir "$mnt" "$esp" 2>/dev/null || :
          }
          trap cleanup EXIT
          loop=$(sudo losetup --find --show --partscan "$expanded")
          test -b "$loop"p2
          test -b "$loop"p3
          sudo mkfs.ext4 -F -L MBOOTDATA "$loop"p3
          sudo mount -t ext4 "$loop"p3 "$mnt"
          sudo test ! -e "$mnt/m/boot/loader"
          sudo test -z "$(sudo find "$mnt" -mindepth 1 -maxdepth 1 ! -name lost+found -print -quit)"
          sudo mount -t vfat "$loop"p2 "$esp"
          for target in i386-pc x86_64-efi arm64-efi
          do
            sudo test -s "$esp/m/boot/loader/$target/normal.mod"
          done
          sudo test -s "$esp/m/boot/loader/init"
          sudo test -s "$esp/EFI/BOOT/BOOTX64.EFI"
          sudo test -s "$esp/EFI/BOOT/BOOTAA64.EFI"
          sync
          sudo umount "$esp"
          sudo umount "$mnt"
          sudo e2fsck -fn "$loop"p3
          sudo losetup -d "$loop"
          loop=
          sudo sgdisk --verify "$expanded"
          echo "Successfully simulated GPT expansion, empty exFAT payload and preserved ESP loader on 4GiB image"
      - name: Publish compressed disk image, loader backup and checksums
        uses: actions/upload-artifact@v4
        with:
          name: m-boot-combined-gpt
          path: ${{ runner.temp }}/m-boot-publish/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0
      - name: Commit the public image and loader into the repository
        if: github.ref == 'refs/heads/main'
        run: |
          set -eu
          pub="$RUNNER_TEMP/m-boot-publish/repo"
          git fetch origin main
          git switch -c publish-combined-image origin/main
          mkdir -p images
          cp "$pub/"* images/
          git add -f -- images/
          if git diff --cached --quiet; then
            echo 'Image distribution already matches repository; nothing to publish'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Publish m-boot combined GPT image from $GITHUB_SHA"
          git push origin HEAD:main
